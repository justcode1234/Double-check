[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-dual-strategy"
version = "0.1.0"
description = "Isolated ORB and SPY noise-area paper research; fail-closed execution"
requires-python = ">=3.11"
dependencies = ["exchange-calendars>=4.11,<5", "PyYAML>=6.0,<7", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[project.scripts]
dual-strategy = "dual_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dual_strategy = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
