name: Dashboard smoke test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  launch:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Launch from a fresh checkout
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path
          from urllib.request import ProxyHandler, build_opener

          command = [sys.executable, 'start.py', '--no-browser']
          try:
              url = subprocess.check_output(command, text=True, timeout=360).splitlines()[-1]
              assert url.startswith('http://127.0.0.1:'), url
              opener = build_opener(ProxyHandler({}))
              with opener.open(url, timeout=10) as response:
                  assert 'Two-vote sleeve' in response.read().decode()
              with opener.open(url + 'api/competition', timeout=10) as response:
                  data = json.load(response)
              assert data['config']['risk']['entry_sleeves'] == ['h_etf']
              assert data['config']['two_vote']['required_votes'] == 2
              assert subprocess.check_output(command, text=True, timeout=30).strip() == url
          except Exception:
              logs = Path('moomoo-dual-strategy/private/launcher')
              for name in ('setup.log', 'dashboard.log'):
                  log = logs / name
                  if log.is_file():
                      print(name, log.read_text(encoding='utf-8', errors='replace')[-8000:], flush=True)
              try:
                  with build_opener(ProxyHandler({})).open('http://127.0.0.1:8876/api/launcher', timeout=2) as response:
                      print('Launcher endpoint:', response.read().decode(), flush=True)
              except OSError as exc:
                  print('Launcher endpoint:', str(exc), flush=True)
              raise
